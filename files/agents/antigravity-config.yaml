# ~/.gemini/config/config.json

userSettings:
  themeMode: THEME_MODE_DARK

  # Paths must be absolute, so `~` is replaced during the conversion to JSON.
  # Paths cannot use globs in the sandbox.
  #
  # Permissions are also "Shared with Antigravity" CLI `agy`.
  #
  # https://antigravity.google/docs/cli/permissions
  # https://antigravity.google/docs/cli/sandbox
  enableTerminalSandbox: true
  globalPermissionGrants:
    # Permissions are evaluated in order by their action: Deny → Ask → Allow
    # Keep keys in that order so this file reads top-down: first match wins
    deny:
      - command(curl)
      - command(nc)
      - command(rtk curl)
      - command(rtk telemetry)
      - command(rtk wget)
      - command(ssh)
      - command(sudo)
      - command(wget)
      - read_file(~/.agents/.checkouts/)
      - read_file(~/.ssh/)

    ask:
      - command(cargo update)
      - command(mv)
      - command(rm)

    allow:
      - write_file(/dev/null)
      - command(awk)
      - command(cat)
      - command(cut)
      - command(df)
      - command(du)
      - command(echo)
      - command(find)
      - command(grep)
      - command(head)
      - command(jq)
      - command(ls)
      - command(nl)
      - command(nm)
      - command(rg)
      - command(sed -n)
      - command(sort)
      - command(tail)
      - command(true)
      - command(uniq)
      - command(wc)
      - command(which)
      - command(rtk deps)
      - command(rtk diff)
      - command(rtk find)
      - command(rtk format)
      - command(rtk grep)
      - command(rtk gt)
      - command(rtk jest)
      - command(rtk json)
      - command(rtk lint)
      - command(rtk ls)
      - command(rtk pytest)
      - command(rtk rg)
      - command(rtk test)
      - command(rtk tree)
      - command(rtk tsc)
      - command(rtk wc)

      - command(cargo bench)
      - command(cargo build)
      - command(cargo check)
      - command(cargo clean)
      - command(cargo clippy)
      - command(cargo deny check)
      - command(cargo deny list)
      - command(cargo fetch)
      - command(cargo fix)
      - command(cargo fmt)
      - command(cargo info)
      - command(cargo metadata)
      - command(cargo nextest)
      - command(cargo pgrx test)
      - command(cargo report)
      - command(cargo test)
      - command(cargo tree)
      - command(rtk cargo build)
      - command(rtk cargo check)
      - command(rtk cargo clippy)
      - command(rtk cargo nextest)
      - command(rtk cargo test)

      - command(rtk gh issue list)
      - command(rtk gh issue status)
      - command(rtk gh issue view)
      - command(rtk gh pr checks)
      - command(rtk gh pr diff)
      - command(rtk gh pr list)
      - command(rtk gh pr status)
      - command(rtk gh pr view)
      - command(rtk gh project list)
      - command(rtk gh project view)
      - command(rtk gh release list)
      - command(rtk gh release view)

      - command(git diff)
      - command(git fetch)
      - command(git grep)
      - command(git log)
      - command(git mv)
      - command(git show)
      - command(git status)
      - command(rtk git diff)
      - command(rtk git fetch)
      - command(rtk git log)
      - command(rtk git show)
      - command(rtk git status)

      - command(git branch --list)
      - command(git check-ignore)
      - command(git --no-pager diff)
      - command(git diff-tree)
      - command(git ls-files)
      - command(git merge-base)
      - command(git rev-parse)
      - command(git worktree add)
      - command(git worktree list)
      - command(rtk git worktree add)
      - command(rtk git worktree list)

      - command(go build)
      - command(go clean)
      - command(go doc)
      - command(go fmt)
      - command(go generate)
      - command(go test)
      - command(go vet)
      - command(rtk go build)
      - command(rtk go test)
      - command(rtk go vet)

      # Extracted source code from package managers
      - read_file(~/.cargo/registry/src/) # Rust/Cargo: https://doc.rust-lang.org/cargo/guide/cargo-home.html
      - read_file(~/.pgrx/)               # Postgres
      - read_file(~/go/pkg/mod/)          # Go: https://go.dev/ref/mod#module-cache

      # System headers
      - read_file(~/.local/homebrew/include/)
      - read_file(/usr/include/)

      # Package documentation sites
      - read_url(doc.rust-lang.org/*)
      - read_url(docs.rs/*)
      - read_url(pkg.go.dev/*)

      # Agent documentation
      - read_url(antigravity.google/docs/*)
