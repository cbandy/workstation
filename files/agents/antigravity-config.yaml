# ~/.gemini/config/config.json

userSettings:
  themeMode: THEME_MODE_DARK

  # Paths must be absolute, so `~` is replaced during the conversion to JSON.
  # Paths cannot use globs in the sandbox.
  #
  # Permissions are also "Shared with Antigravity" CLI `agy`.
  #
  # https://antigravity.google/docs/cli/permissions
  # https://antigravity.google/docs/cli/sandbox
  enableTerminalSandbox: true
  globalPermissionGrants:
    # Permissions are evaluated in order by their action: Deny → Ask → Allow
    # Keep keys in that order so this file reads top-down: first match wins
    deny:
      - command(curl)
      - command(sudo)
      - command(wget)
      - read_file(~/.agents/.checkouts/)
      - read_file(~/.ssh/)

    ask:
      - command(cargo update)
      - command(mv)
      - command(rm)

    allow:
      - write_file(/dev/null)
      - command(awk)
      - command(cat)
      - command(cut)
      - command(df)
      - command(du)
      - command(echo)
      - command(find)
      - command(grep)
      - command(head)
      - command(jq)
      - command(ls)
      - command(nm)
      - command(rg)
      - command(sed -n)
      - command(sort)
      - command(tail)
      - command(uniq)
      - command(wc)
      - command(which)

      - command(cargo bench)
      - command(cargo build)
      - command(cargo check)
      - command(cargo clean)
      - command(cargo clippy)
      - command(cargo deny check)
      - command(cargo deny list)
      - command(cargo fetch)
      - command(cargo fix)
      - command(cargo fmt)
      - command(cargo info)
      - command(cargo metadata)
      - command(cargo nextest)
      - command(cargo pgrx test)
      - command(cargo report)
      - command(cargo test)
      - command(cargo tree)

      - command(gh issue list)
      - command(gh issue status)
      - command(gh issue view)
      - command(gh pr checks)
      - command(gh pr diff)
      - command(gh pr list)
      - command(gh pr status)
      - command(gh pr view)
      - command(gh project list)
      - command(gh project view)
      - command(gh release list)
      - command(gh release view)

      - command(git diff)
      - command(git grep)
      - command(git log)
      - command(git mv)
      - command(git show)
      - command(git status)

      - command(go build)
      - command(go clean)
      - command(go doc)
      - command(go fmt)
      - command(go generate)
      - command(go test)
      - command(go vet)

      # Extracted source code from package managers
      - read_file(~/.cargo/registry/src/) # Rust/Cargo: https://doc.rust-lang.org/cargo/guide/cargo-home.html
      - read_file(~/.pgrx/)               # Postgres
      - read_file(~/go/pkg/mod/)          # Go: https://go.dev/ref/mod#module-cache

      # System headers
      - read_file(~/.local/homebrew/include/)
      - read_file(/usr/include/)

      # Package documentation sites
      - read_url(doc.rust-lang.org/*)
      - read_url(docs.rs/*)
      - read_url(pkg.go.dev/*)

      # Agent documentation
      - read_url(antigravity.google/docs/*)
